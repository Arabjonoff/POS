components:
  schemas:
    AdjustmentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount_tiyin:
          type: integer
        note:
          type: string
          minLength: 1
      required:
      - amount_tiyin
      - note
    AppRelease:
      type: object
      description: Kassa ilovasining oxirgi versiyasi (T-093).
      properties:
        latest_version:
          type: string
        download_url:
          type: string
      required:
      - download_url
      - latest_version
    ApplyRequestRequest:
      type: object
      properties:
        mapping:
          $ref: '#/components/schemas/MappingRequest'
        by:
          type: string
          format: uuid
      required:
      - by
      - mapping
    ApplyResponse:
      type: object
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        error_count:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RowError'
        receipt:
          type: integer
          nullable: true
      required:
      - created
      - error_count
      - errors
      - receipt
      - skipped
      - updated
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
