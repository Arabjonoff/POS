      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtEntryResult'
          description: ''
  /api/v1/customers/{id}/debt-entries/:
    get:
      operationId: customers_debt_entries_list
      description: Queryset faqat joriy tenant yozuvlari; yaratishda tenant avtomatik
