          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: O'z tenanti qurilmalari (ega va menejer).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceList'
          description: ''
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: O'z tenanti qurilmalari (ega va menejer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this qurilma.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/me/:
    get:
      operationId: devices_me_retrieve
      description: Qurilma o'zi haqida va obuna holati (kassa ulanganda tekshiradi).
      tags:
      - devices
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMe'
          description: ''
  /api/v1/devices/register/:
    post:
      operationId: devices_register_create
      description: Ega kassa qurilmasini ulaydi; javobda qurilma tokeni (faqat bir
        marta).
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: Qayta ro'yxatdan o'tish
  /api/v1/inventory-counts/:
    get:
      operationId: inventory_counts_list
      description: Kirim va inventarizatsiya hujjatlari — faqat ega va menejer (tannarx
        ko'rinadi).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - draft
          - posted
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryCountList'
          description: ''
    post:
      operationId: inventory_counts_create
      description: Kirim va inventarizatsiya hujjatlari — faqat ega va menejer (tannarx
        ko'rinadi).
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryCountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InventoryCountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InventoryCountRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCount'
          description: ''
  /api/v1/inventory-counts/{id}/:
    get:
      operationId: inventory_counts_retrieve
      description: Kirim va inventarizatsiya hujjatlari — faqat ega va menejer (tannarx
        ko'rinadi).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this inventarizatsiya.
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCount'
          description: ''
    patch:
      operationId: inventory_counts_partial_update
      description: Faqat qoralama; `items` yuborilsa — almashtiriladi.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this inventarizatsiya.
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInventoryCountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInventoryCountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInventoryCountRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCount'
          description: ''
    delete:
      operationId: inventory_counts_destroy
      description: Faqat qoralama; tasdiqlangani — `409 count_not_draft`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this inventarizatsiya.
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/inventory-counts/{id}/post/:
    post:
