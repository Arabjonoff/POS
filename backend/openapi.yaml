      operationId: products_list
      description: O'qish — tenantning har bir xodimi; yozish — ega va menejer.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: quick_button
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
        description: Nom (qisman), shtrix-kod yoki PLU
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
