openapi: 3.0.3
info:
  title: POS API
  version: 1.0.0
  description: Mahalla do'konlari uchun kassa va ombor tizimi API.
paths:
  /api/health/:
    get:
      operationId: api_health_retrieve
      description: Servis va baza ishlayaptimi (docker healthcheck, monitoring).
      tags:
      - system
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Telefon + parol → JWT (ega, menejer, platforma admini).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: O'z tenanti qurilmalari (ega va menejer).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceList'
          description: ''
  /api/v1/devices/{id}/:
    get:
      operationId: devices_retrieve
      description: O'z tenanti qurilmalari (ega va menejer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this qurilma.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/me/:
    get:
      operationId: devices_me_retrieve
      description: Qurilma o'zi haqida va obuna holati (kassa ulanganda tekshiradi).
      tags:
      - devices
      security:
      - deviceToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMe'
          description: ''
  /api/v1/devices/register/:
    post:
      operationId: devices_register_create
      description: Ega kassa qurilmasini ulaydi; javobda qurilma tokeni (faqat bir
        marta).
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: Qayta ro'yxatdan o'tish
  /api/v1/users/:
    get:
      operationId: users_list
      description: O'z tenanti xodimlari (ega va menejer).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/users/{id}/:
    get:
      operationId: users_retrieve
      description: O'z tenanti xodimlari (ega va menejer).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this foydalanuvchi.
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
          title: Raqam
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nomi
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
          title: Platforma
        app_version:
          type: string
          readOnly: true
          title: Ilova versiyasi
        store:
          type: string
          format: uuid
          readOnly: true
          title: Do'kon
        is_blocked:
          type: boolean
          readOnly: true
          title: Bloklangan
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi sinxron
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi ulanish
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_version
      - code
      - created_at
      - id
      - is_blocked
      - last_seen_at
      - last_sync_at
      - name
      - number
      - platform
      - store
    DeviceMe:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        subscription:
          $ref: '#/components/schemas/SubscriptionSnapshot'
        server_time:
          type: string
          format: date-time
      required:
      - device
      - server_time
      - subscription
    DeviceRegisterRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        app_version:
          type: string
          default: ''
          maxLength: 32
        store:
          type: string
          format: uuid
      required:
      - name
      - platform
    DeviceRegisterResponse:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        token:
          type: string
      required:
      - device
      - token
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - phone
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Telefon
        full_name:
          type: string
          readOnly: true
          title: Ism
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        tenant:
          allOf:
          - $ref: '#/components/schemas/TenantBrief'
          nullable: true
      required:
      - full_name
      - id
      - phone
      - role
      - tenant
    PaginatedDeviceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PlatformEnum:
      enum:
      - windows
      - android
      - ios
      type: string
      description: |-
        * `windows` - Windows
        * `android` - Android
        * `ios` - iOS
    RoleEnum:
      enum:
      - platform_admin
      - owner
      - manager
      - cashier
      type: string
      description: |-
        * `platform_admin` - platforma admini
        * `owner` - ega
        * `manager` - menejer
        * `cashier` - kassir
    SubscriptionSnapshot:
      type: object
      properties:
        status:
          type: string
        paid_until:
          type: string
          format: date
          nullable: true
        days_left:
          type: integer
          nullable: true
        offline_days:
          type: integer
      required:
      - days_left
      - offline_days
      - paid_until
      - status
    TenantBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Telefon
        full_name:
          type: string
          readOnly: true
          title: Ism
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        is_active:
          type: boolean
          readOnly: true
          title: Faol
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - full_name
      - id
      - is_active
      - phone
      - role
  securitySchemes:
    deviceToken:
      type: apiKey
      in: header
      name: Authorization
      description: '`Device <token>` — qurilma tokeni (`/devices/register/` javobidan).'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
