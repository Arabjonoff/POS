            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: O'qish — tenantning har bir xodimi; yozish — ega va menejer.
      parameters:
      - in: path
        name: id
        schema:
