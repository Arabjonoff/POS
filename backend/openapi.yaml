          type: string
          format: uuid
        description: A UUID string identifying this mijoz.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDebtEntryList'
          description: ''
  /api/v1/customers/{id}/payments/:
    post:
      operationId: customers_payments_create
      description: Queryset faqat joriy tenant yozuvlari; yaratishda tenant avtomatik
