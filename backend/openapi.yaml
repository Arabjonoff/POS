components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Nomi
          maxLength: 100
        parent:
          type: string
          format: uuid
          nullable: true
        sort:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Tartib
        color:
          type: string
          title: Rang (palitra kaliti)
          maxLength: 16
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Nomi
          maxLength: 100
        parent:
          type: string
          format: uuid
          nullable: true
        sort:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Tartib
        color:
          type: string
          title: Rang (palitra kaliti)
          maxLength: 16
      required:
      - name
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
          title: Raqam
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nomi
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
          title: Platforma
        app_version:
          type: string
          readOnly: true
          title: Ilova versiyasi
        store:
          type: string
          format: uuid
          readOnly: true
          title: Do'kon
        is_blocked:
          type: boolean
          readOnly: true
          title: Bloklangan
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi sinxron
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi ulanish
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_version
      - code
      - created_at
      - id
      - is_blocked
      - last_seen_at
      - last_sync_at
      - name
      - number
      - platform
      - store
    DeviceMe:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        subscription:
          $ref: '#/components/schemas/SubscriptionSnapshot'
        server_time:
          type: string
          format: date-time
      required:
      - device
      - server_time
      - subscription
    DeviceRegisterRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        app_version:
          type: string
          default: ''
          maxLength: 32
        store:
          type: string
          format: uuid
      required:
      - name
      - platform
    DeviceRegisterResponse:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        token:
          type: string
      required:
      - device
      - token
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - phone
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          nullable: true
          title: Telefon
        full_name:
          type: string
          readOnly: true
          title: Ism
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
        tenant:
          allOf:
          - $ref: '#/components/schemas/TenantBrief'
          nullable: true
      required:
      - full_name
      - id
      - phone
      - role
      - tenant
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedDeviceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    PaginatedProductList:
      type: object
