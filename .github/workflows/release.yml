# Kassa ilovasini chiqarish (T-093, docs/RELEASE.md): `v1.2.3` tegi yoki qo'lda.
# Natija — GitHub Release'da Windows o'rnatuvchi va Android APK.
# Sirlar (Settings → Secrets → Actions):
#   POS_API_URL           — https://api.<domen> (majburiy)
#   SUPPORT_PHONE         — aloqa raqami (Q-008, ixtiyoriy)
#   ANDROID_KEYSTORE_B64  — upload-keystore.jks (base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#                           ANDROID_KEY_PASSWORD (bo'lmasa APK debug kalit bilan — tarqatilmaydi)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -E '^version:' apps/pos/pubspec.yaml | sed -E 's/version: ([0-9.]+)\+.*/\1/')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "pubspec $version != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build installer
        shell: pwsh
        env:
          POS_API_URL: ${{ secrets.POS_API_URL }}
          SUPPORT_PHONE: ${{ secrets.SUPPORT_PHONE }}
        # windows-latest image'da Inno Setup 6 o'rnatilgan.
        run: ./apps/pos/tool/build-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/kassa-setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::Android imzo kaliti yo'q — APK debug kalit bilan"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > apps/pos/android/upload-keystore.jks
          printf 'storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > apps/pos/android/key.properties
      - name: Build APK
        working-directory: apps/pos
        env:
          POS_API_URL: ${{ secrets.POS_API_URL }}
          SUPPORT_PHONE: ${{ secrets.SUPPORT_PHONE }}
        run: |
          test -n "$POS_API_URL" || { echo "POS_API_URL sir kerak"; exit 1; }
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: ([0-9.]+)\+.*/\1/')
          flutter build apk --release \
            --dart-define=POS_API_URL="$POS_API_URL" \
            --dart-define=POS_APP_VERSION="$version" \
            --dart-define=SUPPORT_PHONE="$SUPPORT_PHONE"
          mkdir -p ../../dist && cp build/app/outputs/flutter-apk/app-release.apk "../../dist/kassa-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/kassa-*.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Kassa $GITHUB_REF_NAME" --generate-notes
