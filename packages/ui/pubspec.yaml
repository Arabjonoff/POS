name: pos_ui
description: POS dizayn tizimi — tokenlar, mavzular va komponentlar.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  fonts:
    # Inter 4.1 (SIL OFL 1.1, assets/fonts/OFL.txt) — lotin va kirill.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Roboto Mono (SIL OFL 1.1, assets/fonts/RobotoMono-OFL.txt) — chek
    # ko'rinishi: har belgi bir xil kenglikda, printer ustunlari bilan bir xil.
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
