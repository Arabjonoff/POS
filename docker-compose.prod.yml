# Production (T-092): Caddy (HTTPS) → backend (gunicorn) va admin (Next.js),
# postgres, redis, kunlik zaxira (pg_dump) va obuna holatini yangilash.
# Ishga tushirish va yo'riqnoma: docs/DEPLOY.md
#   cp .env.prod.example .env.prod   # qiymatlarni to'ldiring
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: pos-prod

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY kerak}
  # backend — admin (Next) ichki so'rovlari, 127.0.0.1 — Docker healthcheck.
  DJANGO_ALLOWED_HOSTS: ${API_DOMAIN:?API_DOMAIN kerak},backend,127.0.0.1,localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${API_DOMAIN}
  # HTTP→HTTPS ni Caddy qiladi; Django ichki (http://backend:8000) so'rovlarni yo'naltirmasin.
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
  DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}@postgres:5432/${POSTGRES_DB:-pos}
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:?ADMIN_DOMAIN kerak}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  APP_VERSION: ${APP_VERSION:-}
  # Kassa ilovasining oxirgi versiyasi (T-093, docs/RELEASE.md).
  APP_LATEST_WINDOWS: ${APP_LATEST_WINDOWS:-}
  APP_DOWNLOAD_WINDOWS: ${APP_DOWNLOAD_WINDOWS:-}
  APP_LATEST_ANDROID: ${APP_LATEST_ANDROID:-}
  APP_DOWNLOAD_ANDROID: ${APP_DOWNLOAD_ANDROID:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: pos-backend:prod
    restart: unless-stopped
    environment: *backend-env
    # Migratsiyalar orqaga mos (CLAUDE.md, 10-qoida) — har ishga tushishda.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers ${GUNICORN_WORKERS:-3} --timeout 60 --access-logfile -"
    volumes:
      - static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build: ./apps/admin
    image: pos-admin:prod
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://backend:8000
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend
      - admin

  # Kunlik: obuna holati keshi (`subscription-billing.md`).
  scheduler:
    image: pos-backend:prod
    restart: unless-stopped
    environment: *backend-env
    command: >
      sh -c "while true; do python manage.py update_subscriptions; sleep 86400; done"
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  # Kunlik zaxira: /backups/pos-YYYYMMDD-HHMM.dump, BACKUP_KEEP_DAYS kun saqlanadi.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-pos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-pos}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["sh", "/deploy/backup.sh", "loop"]
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  static:
  caddydata:
  caddyconfig:
